spring:
  application:
    name: querydsl-sample
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/querydsl_sample?allowPublicKeyRetrieval=true&sslMode=DISABLED&connectionTimeZone=Asia/Seoul}
    username: ${DB_USERNAME:querydsl}
    password: ${DB_PASSWORD:querydsl_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
